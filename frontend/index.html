<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="jarvis-app">
        <!-- Background HUD -->
        <div class="hud-bg">
            <div class="hud-grid"></div>
            <div class="hud-glow"></div>
        </div>

        <!-- Arc Reactor HUD (centered, behind everything) -->
        <div class="hud-center">
            <div class="reactor-outer">
                <div class="ring ring-outer ring-1"></div>
                <div class="ring ring-outer ring-2"></div>
                <div class="ring ring-mid ring-3"></div>
                <div class="ring ring-mid ring-4"></div>
                <div class="ring ring-inner ring-5"></div>
                <div class="ring ring-core ring-6"></div>
                <div class="reactor-core">
                    <div class="core-pulse"></div>
                    <div class="core-label">J.A.R.V.I.S</div>
                </div>
                <div class="hud-ticks"></div>
            </div>
        </div>

        <!-- Status bar (top right) -->
        <div class="status-bar">
            <div class="status-indicator">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">ONLINE</span>
            </div>
            <div class="system-time" id="systemTime">00:00:00</div>
        </div>

        <!-- Chat Panel (right side) -->
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <span class="chat-title">COMM CHANNEL</span>
                <button class="chat-toggle" id="chatToggle">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19,13H5V11H19V13Z"/></svg>
                </button>
            </div>
            <div class="chat-area" id="chatArea">
                <div class="message jarvis">
                    <div class="avatar">J</div>
                    <div class="bubble">Përshëndetje! Unë jam JARVIS. Si mund të ndihmoj?</div>
                </div>
            </div>
        </div>

        <!-- Controls (bottom) -->
        <div class="controls-bar">
            <button class="mic-btn" id="wakeBtn">
                <div class="mic-ring"></div>
                <svg viewBox="0 0 24 24" width="26" height="26">
                    <path fill="currentColor" d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z"/>
                </svg>
            </button>
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Shkruaj komandën..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Corner decorations -->
        <div class="corner-dec tl"></div>
        <div class="corner-dec tr"></div>
        <div class="corner-dec bl"></div>
        <div class="corner-dec br"></div>

        <!-- Scan line -->
        <div class="scanline"></div>
    </div>

    <!-- Voice Overlay -->
    <div class="voice-overlay" id="voiceOverlay">
        <div class="vo-reactor">
            <div class="vo-ring vo-ring-1"></div>
            <div class="vo-ring vo-ring-2"></div>
            <div class="vo-ring vo-ring-3"></div>
            <div class="vo-core"></div>
        </div>
        <span class="voice-text" id="voiceText">PO DËGJOJ...</span>
        <div class="voice-waveform">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
        <button class="overlay-close" id="overlayClose">NDALO</button>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
